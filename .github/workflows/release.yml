name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Generate changelog
      id: changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

        if [ -n "$PREV_TAG" ]; then
          echo "## 🚀 Changes since $PREV_TAG" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --reverse >> CHANGELOG.md
        else
          echo "## 🎉 Initial Release" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "First official release of YASAT - Yet Another SAT Solver" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### Features" >> CHANGELOG.md
          git log --pretty=format:"- %s (%h)" --reverse >> CHANGELOG.md
        fi

        echo "" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "---" >> CHANGELOG.md
        echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${{ steps.version.outputs.version }}" >> CHANGELOG.md

        cat CHANGELOG.md

        # Save for later use
        {
          echo 'changelog<<EOF'
          cat CHANGELOG.md
          echo EOF
        } >> $GITHUB_OUTPUT

  build-artifacts:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: create-changelog

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            platform: linux-x86_64
            archive: tar.gz
            arch: x86_64

          # Linux ARM64 (aarch64)
          - os: ubuntu-latest
            platform: linux-aarch64
            archive: tar.gz
            arch: aarch64

          # macOS x86_64 (Intel)
          - os: macos-13
            platform: macos-x86_64
            archive: tar.gz
            arch: x86_64

          # macOS ARM64 (Apple Silicon)
          - os: macos-14
            platform: macos-arm64
            archive: tar.gz
            arch: arm64

          # Windows x86_64
          - os: windows-latest
            platform: windows-x86_64
            archive: zip
            arch: x86_64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Setup QEMU for ARM64 cross-compilation on Linux
    - name: Set up QEMU
      if: runner.os == 'Linux' && matrix.arch == 'aarch64'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: linux/arm64

    # Install dependencies
    - name: Install dependencies (Ubuntu x86_64)
      if: runner.os == 'Linux' && matrix.arch == 'x86_64'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential g++ make

    - name: Install dependencies (Ubuntu ARM64)
      if: runner.os == 'Linux' && matrix.arch == 'aarch64'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu make

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install make gcc

    - name: Setup MSYS2 (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          make
          zip

    # Build
    - name: Build (Linux x86_64)
      if: runner.os == 'Linux' && matrix.arch == 'x86_64'
      run: |
        make clean
        make release
        make lib
        ls -lh build/

    - name: Build (Linux ARM64)
      if: runner.os == 'Linux' && matrix.arch == 'aarch64'
      run: |
        make clean
        CXX=aarch64-linux-gnu-g++ make release
        CXX=aarch64-linux-gnu-g++ make lib
        ls -lh build/
        file build/yasat
        file build/libyasat.so* || true

    - name: Build (macOS)
      if: runner.os == 'macOS'
      run: |
        make clean
        make release
        make lib
        ls -lh build/

    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        make clean
        make release
        make lib
        ls -lh build/

    # Create distribution package
    - name: Create package (Linux)
      if: runner.os == 'Linux'
      run: |
        DIST_DIR="yasat-${{ matrix.platform }}"
        mkdir -p dist/$DIST_DIR

        # Binary and libraries
        cp build/yasat dist/$DIST_DIR/
        cp build/libyasat.so* dist/$DIST_DIR/ || true
        cp build/libyasat.a dist/$DIST_DIR/ || true

        # Headers
        mkdir -p dist/$DIST_DIR/include
        cp -r src/headers/* dist/$DIST_DIR/include/

        # C API
        mkdir -p dist/$DIST_DIR/c_api
        cp src/c_api/yasat.h dist/$DIST_DIR/c_api/
        cp src/c_api/yasat.cpp dist/$DIST_DIR/c_api/

        # Language bindings
        cp -r bindings dist/$DIST_DIR/

        # Documentation
        cp Readme.md dist/$DIST_DIR/ || cp README.md dist/$DIST_DIR/ || true
        cp license.txt dist/$DIST_DIR/ || cp LICENSE dist/$DIST_DIR/ || true

        # Create archive
        cd dist
        tar czf $DIST_DIR-${{ needs.create-changelog.outputs.version }}.tar.gz $DIST_DIR
        sha256sum $DIST_DIR-${{ needs.create-changelog.outputs.version }}.tar.gz > $DIST_DIR-${{ needs.create-changelog.outputs.version }}.tar.gz.sha256
        ls -lh

    - name: Create package (macOS)
      if: runner.os == 'macOS'
      run: |
        DIST_DIR="yasat-${{ matrix.platform }}"
        mkdir -p dist/$DIST_DIR

        # Binary and libraries
        cp build/yasat dist/$DIST_DIR/
        cp build/libyasat*.dylib dist/$DIST_DIR/ || true
        cp build/libyasat.a dist/$DIST_DIR/ || true

        # Headers
        mkdir -p dist/$DIST_DIR/include
        cp -r src/headers/* dist/$DIST_DIR/include/

        # C API
        mkdir -p dist/$DIST_DIR/c_api
        cp src/c_api/yasat.h dist/$DIST_DIR/c_api/
        cp src/c_api/yasat.cpp dist/$DIST_DIR/c_api/

        # Language bindings
        cp -r bindings dist/$DIST_DIR/

        # Documentation
        cp Readme.md dist/$DIST_DIR/ || cp README.md dist/$DIST_DIR/ || true
        cp license.txt dist/$DIST_DIR/ || cp LICENSE dist/$DIST_DIR/ || true

        # Create archive
        cd dist
        tar czf $DIST_DIR-${{ needs.create-changelog.outputs.version }}.tar.gz $DIST_DIR
        shasum -a 256 $DIST_DIR-${{ needs.create-changelog.outputs.version }}.tar.gz > $DIST_DIR-${{ needs.create-changelog.outputs.version }}.tar.gz.sha256
        ls -lh

    - name: Create package (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        DIST_DIR="yasat-${{ matrix.platform }}"
        mkdir -p dist/$DIST_DIR

        # Binary and libraries
        cp build/yasat.exe dist/$DIST_DIR/ || cp build/yasat dist/$DIST_DIR/yasat.exe || true
        cp build/yasat.dll dist/$DIST_DIR/ || cp build/libyasat.dll dist/$DIST_DIR/ || true
        cp build/libyasat.a dist/$DIST_DIR/ || true

        # Headers
        mkdir -p dist/$DIST_DIR/include
        cp -r src/headers/* dist/$DIST_DIR/include/

        # C API
        mkdir -p dist/$DIST_DIR/c_api
        cp src/c_api/yasat.h dist/$DIST_DIR/c_api/
        cp src/c_api/yasat.cpp dist/$DIST_DIR/c_api/

        # Language bindings
        cp -r bindings dist/$DIST_DIR/

        # Documentation
        cp Readme.md dist/$DIST_DIR/ || cp README.md dist/$DIST_DIR/ || true
        cp license.txt dist/$DIST_DIR/ || cp LICENSE dist/$DIST_DIR/ || true

        # Create archive
        cd dist
        zip -r $DIST_DIR-${{ needs.create-changelog.outputs.version }}.zip $DIST_DIR
        sha256sum $DIST_DIR-${{ needs.create-changelog.outputs.version }}.zip > $DIST_DIR-${{ needs.create-changelog.outputs.version }}.zip.sha256
        ls -lh

    # Upload artifacts
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: yasat-${{ matrix.platform }}
        path: |
          dist/yasat-${{ matrix.platform }}-${{ needs.create-changelog.outputs.version }}.${{ matrix.archive }}
          dist/yasat-${{ matrix.platform }}-${{ needs.create-changelog.outputs.version }}.${{ matrix.archive }}.sha256
        retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [create-changelog, build-artifacts]
    runs-on: ubuntu-latest

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure
      run: |
        ls -R artifacts/

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        find artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
        find artifacts -type f -name "*.zip" -exec cp {} release-assets/ \;
        find artifacts -type f -name "*.sha256" -exec cp {} release-assets/ \;
        ls -lh release-assets/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: YASAT v${{ needs.create-changelog.outputs.version }}
        body: ${{ needs.create-changelog.outputs.changelog }}
        draft: false
        prerelease: false
        files: release-assets/*
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Release summary
      run: |
        echo "## 🎉 Release v${{ needs.create-changelog.outputs.version }} Published!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Release Assets" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Platform | Archive | Checksum |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|---------|----------|" >> $GITHUB_STEP_SUMMARY
        for file in release-assets/*.tar.gz release-assets/*.zip; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            platform=$(echo "$filename" | sed 's/yasat-\(.*\)-[0-9].*/\1/')
            checksum=$(cat "$file.sha256" 2>/dev/null | awk '{print $1}' | cut -c1-12)
            echo "| $platform | $filename | \`${checksum}...\` |" >> $GITHUB_STEP_SUMMARY
          fi
        done
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔗 [View Release](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.create-changelog.outputs.version }})" >> $GITHUB_STEP_SUMMARY
